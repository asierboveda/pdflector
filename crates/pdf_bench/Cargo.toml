[package]
name = "pdf_bench"
version = "0.1.0"
edition.workspace = true

[dependencies]
pdf_core = { path = "../pdf_core" }

[dev-dependencies]
criterion = "0.8"
# serde_json for the annotations/serialize bench: measures the JSON persist
# path of AnnotationSet (same crate pdf_core already uses; MIT/Apache-2.0).
serde_json = "1"

[[bench]]
name = "open_render"
harness = false

[[bench]]
name = "cache_scroll"
harness = false

[[bench]]
name = "render_perf"
harness = false

[[bench]]
name = "zoom"
harness = false

[[bench]]
name = "annotations"
harness = false
