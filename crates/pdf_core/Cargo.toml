[package]
name = "pdf_core"
version = "0.1.0"
edition.workspace = true

[features]
default = ["pdfium"]
pdfium = ["dep:pdfium-render"]

[dependencies]
# PDFium backend (Chromium's PDF engine, BSD-3-Clause). Prebuilt lib fetched
# by tools/fetch_pdfium.sh. Alternative backends (MuPDF) decided in ADR-001.
pdfium-render = { version = "0.8", optional = true, features = ["thread_safe", "sync"] }
