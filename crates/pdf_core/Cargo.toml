[package]
name = "pdf_core"
version = "0.1.0"
edition.workspace = true

[features]
# MuPDF is the single engine (ADR-001, Fase 0.5): always compiled, no feature
# needed. `base14-fonts` ships the standard Helvetica/Times/Courier fonts used
# by the test corpus.
default = []

[dependencies]
# MuPDF backend via messense/mupdf 0.8 (bindings to MuPDF C, AGPL-3.0 — chosen
# in ADR-001). Minimal feature set: only the base-14 PDF fonts; no
# epub/html/xps/svg/cbz/tesseract/docx/js/brotli. Links statically via
# mupdf-sys (no external library to fetch).
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
# LRU map for the byte-bounded render cache (B1, Fase 1). Consolidated crate,
# MIT license (verified with `cargo info lru`), no unsafe. Only the LRU
# ordering/tracking is used; byte-budget eviction is handled in `cache.rs`.
lru = "0.18"
# Serialization for the vector annotation model (Fase 3): canonical JSON for
# the SQLite sidecar (store.rs) and Markdown/PDF export. serde + serde_json are
# MIT/Apache-2.0, the de-facto standard; no unsafe in our usage.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenAI-compatible HTTPS client for the Groq cloud path (Fase 5, GroqClient
# in ai.rs). Ollama talks plain HTTP over raw TcpStream; Groq lives in the
# cloud, so it needs TLS: `rustls-tls` keeps TLS in pure Rust (no OpenSSL,
# which would complicate the later aarch64-linux-android cross-compile;
# native-tls would pull in openssl-sys). `blocking` gives a simple
# synchronous client for a dedicated background thread. MIT/Apache-2.0,
# the de-facto standard HTTP crate.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# SQLite sidecar per PDF (Fase 3): persistence of the annotation set, designed
# for Syncthing (one small .db per document). rusqlite is MIT; the `bundled`
# feature compiles SQLite from source (no system lib), so cross-compiling to
# aarch64-linux-android later needs no extra system dependency.
rusqlite = { version = "0.37", features = ["bundled"] }
# Filesystem change detection for Fase 4 sync (hot-reload of annotations changed
# by Syncthing on another device). notify is MIT/Apache-2.0, std-ish, no unsafe
# in our usage; only local FS events, no network.
notify = "8"
