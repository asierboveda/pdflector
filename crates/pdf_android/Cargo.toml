[package]
name = "pdf_android"
version = "0.1.0"
edition.workspace = true
description = "Native Android PDF reader rendered through GameActivity and pdf_core (MuPDF)."

[lib]
crate-type = ["cdylib"]

[dependencies]
# pdf_core (motor MuPDF, ADR-001) sin features extra: rusqlite/notify ya
# cross-compilan a aarch64-linux-android (fix del agente de build paralelo).
pdf_core = { path = "../pdf_core" }
# Ciclo de vida de la Activity + ANativeWindow + input. GameActivity permite
# usar una Activity Kotlin propia y vistas AndroidX sobre la superficie nativa.
android-activity = { version = "0.6", features = ["game-activity"] }
# ANativeWindow lock/stride/format. Se usa el mismo 0.9 que android-activity,
# sin features por defecto para no inflar el grafo (native_window es base).
ndk = { version = "0.9", default-features = false }
# JNI para el picker de PDFs: dibuja la lista con android.graphics.Canvas
# (fuente del sistema, antialiasing) y lee los píxeles con Bitmap.getPixels.
# Misma versión (0.22) que usa android-activity 0.6, así que reutiliza
# JavaVM::singleton() sin duplicar la crate. MIT/Apache-2.0.
jni = "0.22"
# Log a logcat. MIT.
log = "0.4"
android_logger = "0.15"
# Estado del visor (posicion + modo oscuro) en internal/state.json. serde y
# serde_json ya estan en el grafo via pdf_core (mismas versiones, ya
# cross-compiladas a aarch64-linux-android): no anaden unidades de
# compilacion ni tamano al .so. MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG en memoria del crop de la selección para "Preguntar a la IA" con
# visión (Fase 5, `Reader::sel_image_png_base64`): `png` 0.18 es el encoder
# PNG puro en Rust (RGBA8 -> PNG) SIN el grafo de formatos de `image` (la
# opción más ligera de las dos que barajó el autor: solo codificación, sin
# decodificación ni metadatos que no usamos). Ya está en el Cargo.lock del
# workspace vía `image` (grafo de pdf_app), así que no añade paquetes nuevos
# a la compilación Android. MIT/Apache-2.0.
png = "0.18"
# Base64 del PNG (sin prefijo data:) que espera `GroqClient::chat_vision`
# (el prefijo `data:image/png;base64,` lo añade pdf_core). Crate estándar,
# puro Rust, sin dependencias. MIT/Apache-2.0.
base64 = "0.22"

# --- Package de la APK productiva (android/product) ---
[package.metadata.android]
package = "com.pdflector.app"

# --- Permisos de almacenamiento (biblioteca MediaStore, 2026-08-13) ---
# La biblioteca consulta MediaStore.Files para listar los PDFs del sistema
# (Download/Documents). En Android 13+ (API 33+, p. ej. la TCL 9469X con
# Android 15) la lectura de documentos ajenos exige el appop "All files access"
# (MANAGE_EXTERNAL_STORAGE), que el usuario concede en Ajustes; NO existe un
# READ_MEDIA_* para documentos (PDF no es imagen/vídeo/audio). En Android ≤ 12
# basta READ_EXTERNAL_STORAGE (el sistema la ignora en 13+, por eso va con
# maxSdkVersion=32). Verificado en la tablet: con READ_EXTERNAL_STORAGE sola la
# query devuelve 0 filas; con MANAGE_EXTERNAL_STORAGE concedido devuelve todos
# los PDFs reales de Descargas/Documentos.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# --- Permiso INTERNET (Fase 5: "Preguntar a la IA" vía Groq; Fase B: Descubrir arXiv) ---
# Usos de red exclusivos en hilos de fondo dedicados:
# 1. `GroqClient` (pdf_core::ai): peticiones HTTPS a api.groq.com para consultas de IA.
# 2. `ArxivClient` / `DiscoverWorker` (pdf_core::arxiv, pdf_android::discover): consultas
#    a export.arxiv.org y descargas de PDFs de acceso abierto desde arxiv.org.
# Sin este permiso la llamada de red falla al instante en Android (SocketException:
# permission denied). No hay telemetría, analítica ni otros usos de red en la app.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# --- "Abrir con" (ACTION_VIEW) ---
[package.metadata.android.application]
label = "PDFLector"

[package.metadata.android.application.activity]
exported = true
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|layoutDirection|density|fontScale"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/pdf"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "pdflector"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "text/plain"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35
